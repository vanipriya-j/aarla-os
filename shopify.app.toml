# Aarla OS — Shopify Dev Dashboard app configuration
# Link with: npx shopify app config link
# Then release scopes and install on the store from the Dev Dashboard.

name = "aarla-os"
client_id = "REPLACE_WITH_CLIENT_ID"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = false

[access_scopes]
# Commerce + catalog + bidirectional inventory sync.
# After changing scopes: shopify app deploy / Dev Dashboard release, then reinstall on the store.
scopes = "read_customers,read_orders,read_all_orders,read_products,read_inventory,write_inventory,read_locations"

[auth]
redirect_urls = [ "https://shopify.dev/apps/default-app-home" ]

[webhooks]
api_version = "2025-01"

# Web Pixel extension lives at extensions/aarla-commerce-pixel/
# Deploy with: npx shopify app deploy
# Then set ingestUrl + secret in the extension settings (see docs/shopify-web-pixel.md).
# Fallback: Custom Pixel paste snippet in that doc if CLI wiring is incomplete.
